name: Fetch EurekAlert Press Releases

on:
  schedule:
    # 1時間に1回、自動で実行する設定 (UTC時間のため、毎時0分に実行)
    - cron: '0 * * * *'
  workflow_dispatch: # ボタンを押して手動でいつでも実行できる設定

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリにファイル変更を書き込むために必要

    steps:
    - name: リポジトリのコードをチェックアウト
      uses: actions/checkout@v4

    - name: Pythonのセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: プレスリリースを取得して解析
      run: python fetch_press.py

    - name: 新着があればGitHubにコミットして保存
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # 変更（新着）があるか確認
        if [ -n "$(git status --porcelain)" ]; then
          git add releases.csv
          git commit -m "更新: 新着プレスリリースを追加"
          git push
        else
          echo "変更はありませんでした。"
        fi
